<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>speed4trading — اتصال الهاتف</title><style>body{font:18px/1.8 'Segoe UI',sans-serif;background:#f3f6fb;color:#142b4b;padding:24px}main{max-width:700px;margin:auto;background:white;padding:28px;border-radius:20px}label{display:grid;margin:14px 0}input,button{font:inherit;padding:12px;min-width:0;border:1px solid #cbd8e8;border-radius:10px}button{background:#1d5ed8;color:white}small{color:#51657f}</style><main><h1>اتصال الهاتف بخادم speed4trading</h1><p>استخدم شهادة HTTPS موثوقة تطابق اسم الخادم. هذا الإجراء يعيد تشغيل خادم التطبيق الخاص بspeed4trading فقط. لا يغير Firewall أو Tailscale أو إعدادات البصمة.</p><form id="connection"><label>اسم مسؤول النظام<input name="username" required autocomplete="username"></label><label>كلمة مرور مسؤول النظام<input type="password" name="password" required autocomplete="current-password"></label><label>عنوان الاستماع<input name="host" dir="ltr" required value="127.0.0.1"></label><small>127.0.0.1 للكمبيوتر فقط؛ 0.0.0.0 للشبكات المسموح بها بعد تجهيز الشهادة وموافقة المسؤول.</small><label>المنفذ<input name="port" type="number" min="1024" max="65535" required value="8787"></label><label>اسم الخادم المطابق للشهادة<input name="serverName" dir="ltr" placeholder="access.example.com"></label><label>المسار المحلي لشهادة PEM<input name="tlsCert" dir="ltr" placeholder="C:\Certificates\fullchain.pem"></label><label>المسار المحلي للمفتاح الخاص PEM<input name="tlsKey" dir="ltr" placeholder="C:\Certificates\privkey.pem"></label><label><span><input type="checkbox" name="allowNetwork"> أوافق على إتاحة خادم speed4trading للشبكة المحددة باستخدام HTTPS.</span></label><label>اكتب: تغيير اتصال speed4trading<input name="phrase" required autocomplete="off"></label><button type="submit">تأكيد الاتصال وإعادة تشغيل خادم speed4trading</button><p role="status" id="status"></p></form></main><script src="connection-renderer.js"></script></html>
